name = "propwatch-worker"
main = "index.js"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "propwatch-db"
database_id = "b4330ef2-78c4-48be-ae88-b1d94614faad"

# HKT = UTC+8. Daily sync is split across staggered slots so each runs in its
# own invocation (Cloudflare blocks self-fetch chaining; no Queues on this plan).
# 每個 slot 嘅 offset / 屋苑範圍由 index.js 嘅 SYNC_SLOTS + SYNC_SLOT_SIZE 決定，
# 容量 = slot 數 × SYNC_SLOT_SIZE。加屋苑加到爆容量，slot 0 會發 telegram 警示。
#   "*/2 * * * *" = 每 2 分鐘 → drip sync。每次 invocation 由 pending queue
#                   (屋苑 × source × 放盤/成交/租盤/租務成交) 盡量做多個單元，
#                   受兩個 budget 夾：時間 53s、subrequest 實數 46（見
#                   index.js DRIP_BATCH_*）。今日全部搞掂就 idle，唔會白撞 portal。
#
#                   開工時間：HK 06:00（index.js SYNC_START_HOUR）。之前係
#                   00:00，但凌晨啲代理網成日做 maintenance，抓返嚟殘缺，
#                   反而製造假「下架」。06:00 已經避開 maintenance window，
#                   又留夠時間趕得切 09:00 個 email。
#
#                   實測 98 個單元（2026-08-18）：
#                     舊（subreq 估算寫死 30）→ 64 分鐘，尾段 13 次 × 1 個
#                     新（估算改實測值 + 數實數做硬閘）→ 19 分鐘，平均 9.8 個/次
#
#                   ⚠️ 唔好縮到 "* * * * *"（每分鐘）：一個 invocation 可以行
#                   足 53 秒，兩個會 overlap 撞同一個 pending 單元（數據唔會壞
#                   ——sync_log 同 saveXxx 都 idempotent——但白撞 portal）。
#   "0 1 * * *"   = 09:00 HKT → "今日動態" email (separate invocation)
#                   要喺抓數據(06:00 開工，實測 ~19 分鐘)之後先寄。
#
# ⚠️ Workers Free 上限係每個 account 5 個 cron trigger，但個限制係計 expression
# 數目而唔係執行次數："*/2 * * * *" 只佔 1 個名額，一日卻跑 720 次。之前用 4 個
# 固定時間（16:00/16:10/16:20/16:30）佔 4 個名額但一日只跑 4 次，好蝕。
# 而家用 2 個名額，剩 3 個備用。
#
# ⚠️ 改呢條 expression 一定要同時改 index.js 個 DRIP_CRON 常數——
# scheduled() 靠 `event.cron === DRIP_CRON` 分流，唔一致 drip sync 會完全唔行。
[triggers]
crons = ["*/2 * * * *", "0 1 * * *"]

# Workers Logs。之前完全冇開,所以 cron 出事嗰陣 console.error 一句都攞唔返,
# 查「收唔到 email 又冇 alert」淨係得 GraphQL 個 invocation 數字睇,查唔到
# 邊一步死。開咗之後 `npx wrangler tail` 同 dashboard 都有得睇返。
[observability]
enabled = true
