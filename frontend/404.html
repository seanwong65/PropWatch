<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搵唔到呢版 — 搵樓日記</title>
  <!-- Cloudflare Pages 見到根目錄有 404.html，就會對唔存在嘅網址回真正嘅
       404（之前冇呢個檔，所有亂打嘅網址都回 200 + 首頁 = soft 404）。 -->
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang HK", "Noto Sans HK",
        "Microsoft JhengHei", sans-serif;
      background: #f5f5f0; color: #16211d; text-align: center; padding: 1.5rem;
    }
    h1 { font-size: 1.5rem; margin: 0 0 0.6rem; }
    p { color: #5c6b66; margin: 0 0 1.6rem; line-height: 1.7; }
    .links { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; }
    a { display: inline-block; border-radius: 10px; padding: 0.7rem 1.4rem; text-decoration: none; font-weight: 600; }
    .primary { background: #047857; color: #fff; }
    .ghost { border: 1px solid rgba(16,42,34,0.14); color: #16211d; background: #fff; }
  </style>
</head>
<body>
  <main>
    <h1>🏙️ 搵唔到呢版</h1>
    <p>呢個網址唔存在，可能打錯咗，或者連結已經改咗。</p>
    <div class="links">
      <a class="primary" href="/">返去搵樓日記</a>
      <a class="ghost" href="/mortgage-calculator">按揭計算機</a>
    </div>
  </main>
</body>
</html>
